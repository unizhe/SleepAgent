[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sleepagent"
version = "0.1.0"
description = "MVP skeleton for an intelligent sleep health analysis system."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn",
    "pydantic",
    "pytest",
    "httpx>=0.27",
    "langgraph>=0.2",
    "cryptography>=42",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]
typecheck = [
    "mypy>=2.3,<2.4",
]

[project.scripts]
radar-agent = "sleepagent.radar_agent.cli:main"
dynamic-agent-acceptance = "sleepagent.radar_agent.dynamic.acceptance:main"
real-perceptor-acceptance = "sleepagent.integrations.perceptor.acceptance_cli:main"

[tool.setuptools.packages.find]
include = ["sleepagent*", "reference_client*"]

[tool.setuptools.package-data]
"sleepagent.radar_agent.replay" = ["scenario_catalog.json", "workflow_goldens.json"]
"sleepagent.radar_agent.persistence" = ["migrations/*.sql"]
"sleepagent.simulation.fixtures" = [
    "README.md",
    "scenarios/*/scenario.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
