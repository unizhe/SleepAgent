[build-system]
requires = [
    "setuptools==80.9.0",
    "wheel==0.45.1",
]
build-backend = "setuptools.build_meta"

[project]
name = "sleepagent"
version = "0.1.0"
description = "MVP skeleton for an intelligent sleep health analysis system."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "cryptography>=42,<47",
    "fastapi>=0.115,<=0.136.1",
    "httpx>=0.27,<0.28",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.9,<2.13",
    "starlette>=0.46,<1.1",
    "uvicorn>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "build==1.5.0",
    "mypy>=2.3,<2.4",
    "pip==24.0",
    "pip-tools==7.4.1",
    "pytest>=8.3,<10",
    "setuptools==80.9.0",
    "wheel==0.45.1",
]

[project.scripts]
real-perceptor-acceptance = "sleepagent.integrations.perceptor.acceptance_cli:main"
sleepagent-demo = "sleepagent.demo_cli:main"
sleepagent-migrate = "sleepagent.persistence.migrate:main"

[tool.setuptools.packages.find]
include = ["backend*", "sleepagent*", "reference_client*"]

[tool.setuptools.package-data]
"sleepagent.simulation" = ["replay_seed_registry.json"]
"sleepagent.persistence" = [
    "migration_manifest.json",
    "migrations/*.sql",
    "sqlite_schema.sql",
]
"sleepagent.simulation.fixtures" = [
    "README.md",
    "scenarios/*/scenario.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers"]
markers = [
    "unit: deterministic tests without a PostgreSQL or process dependency",
    "postgres: tests against an isolated PostgreSQL database/schema",
    "asgi_lifespan: tests that execute real ASGI startup and shutdown",
    "e2e: tests that require independently running API and worker processes",
]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
