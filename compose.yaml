name: sleepagent

x-backend-image: &backend-image
  image: sleepagent-backend-test:local
  build:
    context: .
    dockerfile: Dockerfile
    target: development

x-runtime-environment: &runtime-environment
  SLEEPAGENT_BACKEND_PROFILE: test-postgres
  SLEEPAGENT_BACKEND_DEPLOYMENT_MODE: test
  SLEEPAGENT_BACKEND_DATA_MODE: replay
  SLEEPAGENT_BACKEND_DATABASE_SCOPE: replay
  SLEEPAGENT_BACKEND_DATABASE_IDENTITY: ${SLEEPAGENT_TEST_POSTGRES_DB:?required}
  SLEEPAGENT_BACKEND_NAMESPACE_PREFIXES: ${SLEEPAGENT_BACKEND_NAMESPACE_PREFIXES:?copy .env.test.example to .env.test}
  SLEEPAGENT_BACKEND_SIGNING_KEY_REF: file:/run/sleepagent/actor-public.pem
  SLEEPAGENT_BACKEND_ENCRYPTION_KEY_REF: test:key-provider/encryption
  SLEEPAGENT_BACKEND_ACTOR_ASSERTION_ISSUER: ${SLEEPAGENT_BACKEND_ACTOR_ASSERTION_ISSUER:-sleepagent-bff-v1}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${SLEEPAGENT_TEST_POSTGRES_DB:?copy .env.test.example to .env.test}
      POSTGRES_USER: ${SLEEPAGENT_TEST_POSTGRES_ADMIN_USER:?copy .env.test.example to .env.test}
      POSTGRES_PASSWORD: ${SLEEPAGENT_TEST_POSTGRES_ADMIN_PASSWORD:?copy .env.test.example to .env.test}
    ports:
      - "${SLEEPAGENT_TEST_POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - sleepagent_backend_test_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  migrate:
    <<: *backend-image
    entrypoint:
      - python
      - -m
      - sleepagent.persistence.migrate
    command:
      - apply
    environment:
      <<: *runtime-environment
      SLEEPAGENT_BACKEND_PROCESS_ROLE: migration
      SLEEPAGENT_BACKEND_ENABLED_SURFACES: ""
      SLEEPAGENT_BACKEND_DATABASE_DSN: postgresql://${SLEEPAGENT_TEST_POSTGRES_ADMIN_USER:?required}:${SLEEPAGENT_TEST_POSTGRES_ADMIN_PASSWORD:?required}@postgres:5432/${SLEEPAGENT_TEST_POSTGRES_DB:?required}
      SLEEPAGENT_BACKEND_DATABASE_ROLE: ${SLEEPAGENT_TEST_POSTGRES_ADMIN_USER:?required}
      SLEEPAGENT_BACKEND_SERVICE_PRINCIPAL_ID: sleepagent-migration-test
      SLEEPAGENT_BACKEND_SERVICE_CREDENTIAL_REF: test:key-provider/migration-service-credential
      SLEEPAGENT_BACKEND_POOL_MIN_SIZE: ${SLEEPAGENT_MIGRATION_POOL_MIN_SIZE:-1}
      SLEEPAGENT_BACKEND_POOL_MAX_SIZE: ${SLEEPAGENT_MIGRATION_POOL_MAX_SIZE:-1}
    volumes:
      - ${SLEEPAGENT_TEST_ACTOR_PUBLIC_KEY_PATH:-./tests/fixtures/keys/replay_actor_public.pem}:/run/sleepagent/actor-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  test-bootstrap:
    <<: *backend-image
    entrypoint:
      - python
      - -m
      - sleepagent.persistence.test_bootstrap
    environment:
      <<: *runtime-environment
      SLEEPAGENT_BACKEND_PROCESS_ROLE: migration
      SLEEPAGENT_BACKEND_ENABLED_SURFACES: ""
      SLEEPAGENT_BACKEND_DATABASE_DSN: postgresql://${SLEEPAGENT_TEST_POSTGRES_ADMIN_USER:?required}:${SLEEPAGENT_TEST_POSTGRES_ADMIN_PASSWORD:?required}@postgres:5432/${SLEEPAGENT_TEST_POSTGRES_DB:?required}
      SLEEPAGENT_BACKEND_DATABASE_ROLE: ${SLEEPAGENT_TEST_POSTGRES_ADMIN_USER:?required}
      SLEEPAGENT_BACKEND_SERVICE_PRINCIPAL_ID: sleepagent-test-bootstrap
      SLEEPAGENT_BACKEND_SERVICE_CREDENTIAL_REF: test:key-provider/migration-service-credential
      SLEEPAGENT_BOOTSTRAP_API_DATABASE_ROLE: ${SLEEPAGENT_TEST_POSTGRES_API_USER:?required}
      SLEEPAGENT_BOOTSTRAP_API_DATABASE_PASSWORD: ${SLEEPAGENT_TEST_POSTGRES_API_PASSWORD:?required}
      SLEEPAGENT_BOOTSTRAP_DEMO_DATABASE_ROLE: ${SLEEPAGENT_TEST_POSTGRES_DEMO_USER:?required}
      SLEEPAGENT_BOOTSTRAP_DEMO_DATABASE_PASSWORD: ${SLEEPAGENT_TEST_POSTGRES_DEMO_PASSWORD:?required}
      SLEEPAGENT_BOOTSTRAP_WORKER_DATABASE_ROLE: ${SLEEPAGENT_TEST_POSTGRES_WORKER_USER:?required}
      SLEEPAGENT_BOOTSTRAP_WORKER_DATABASE_PASSWORD: ${SLEEPAGENT_TEST_POSTGRES_WORKER_PASSWORD:?required}
      SLEEPAGENT_BOOTSTRAP_API_SERVICE_PRINCIPAL_ID: sleepagent-bff-test
      SLEEPAGENT_BOOTSTRAP_DEMO_SERVICE_PRINCIPAL_ID: sleepagent-demo-test
      SLEEPAGENT_BOOTSTRAP_WORKER_SERVICE_PRINCIPAL_ID: sleepagent-worker-test
      SLEEPAGENT_BOOTSTRAP_ACTOR_VERIFICATION_KEY_SHA256: ${SLEEPAGENT_TEST_ACTOR_PUBLIC_KEY_SHA256:?required}
    volumes:
      - ${SLEEPAGENT_TEST_ACTOR_PUBLIC_KEY_PATH:-./tests/fixtures/keys/replay_actor_public.pem}:/run/sleepagent/actor-public.pem:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *backend-image
    command:
      - uvicorn
      - sleepagent.app:app
      - --host
      - 0.0.0.0
      - --port
      - "18000"
    environment:
      <<: *runtime-environment
      SLEEPAGENT_BACKEND_PROCESS_ROLE: api
      SLEEPAGENT_BACKEND_ENABLED_SURFACES: public_v1,product
      SLEEPAGENT_BACKEND_DATABASE_DSN: postgresql://${SLEEPAGENT_TEST_POSTGRES_API_USER:?required}:${SLEEPAGENT_TEST_POSTGRES_API_PASSWORD:?required}@postgres:5432/${SLEEPAGENT_TEST_POSTGRES_DB:?required}
      SLEEPAGENT_BACKEND_DATABASE_ROLE: ${SLEEPAGENT_TEST_POSTGRES_API_USER:?required}
      SLEEPAGENT_BACKEND_SERVICE_PRINCIPAL_ID: sleepagent-bff-test
      SLEEPAGENT_BACKEND_SERVICE_CREDENTIAL_REF: test:key-provider/api-service-credential
      # Report reads must compute the same semantic model manifest as the worker.
      SLEEPAGENT_PRODUCT_ANALYSIS_MODEL_MODE: ${SLEEPAGENT_BACKEND_MODEL_MODE:-deterministic}
      SLEEPAGENT_PRODUCT_LLM_MODEL: ${SLEEPAGENT_PRODUCT_LLM_MODEL:-${SLEEPAGENT_RADAR_AGENT_LLM_MODEL_ID:-deepseek-v4-flash}}
      SLEEPAGENT_PRODUCT_LLM_BASE_URL: ${SLEEPAGENT_PRODUCT_LLM_BASE_URL:-${SLEEPAGENT_RADAR_AGENT_LLM_BASE_URL:-https://api.deepseek.com}}
      SLEEPAGENT_PRODUCT_LLM_TIMEOUT_SECONDS: ${SLEEPAGENT_PRODUCT_LLM_TIMEOUT_SECONDS:-${SLEEPAGENT_RADAR_AGENT_LLM_TIMEOUT_SECONDS:-30}}
      SLEEPAGENT_PRODUCT_LLM_MAX_TOKENS: ${SLEEPAGENT_PRODUCT_LLM_MAX_TOKENS:-4000}
      SLEEPAGENT_BACKEND_POOL_MIN_SIZE: ${SLEEPAGENT_API_POOL_MIN_SIZE:-1}
      SLEEPAGENT_BACKEND_POOL_MAX_SIZE: ${SLEEPAGENT_API_POOL_MAX_SIZE:-5}
    volumes:
      - ${SLEEPAGENT_TEST_ACTOR_PUBLIC_KEY_PATH:-./tests/fixtures/keys/replay_actor_public.pem}:/run/sleepagent/actor-public.pem:ro
    ports:
      - "18000:18000"
    depends_on:
      test-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:18000/livez', timeout=3).read()
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  demo-api:
    <<: *backend-image
    command:
      - uvicorn
      - sleepagent.app:app
      - --host
      - 0.0.0.0
      - --port
      - "18001"
    environment:
      <<: *runtime-environment
      SLEEPAGENT_BACKEND_PROFILE: test-postgres-demo
      SLEEPAGENT_BACKEND_PROCESS_ROLE: api
      SLEEPAGENT_BACKEND_ENABLED_SURFACES: demo
      SLEEPAGENT_BACKEND_DATABASE_DSN: postgresql://${SLEEPAGENT_TEST_POSTGRES_DEMO_USER:?required}:${SLEEPAGENT_TEST_POSTGRES_DEMO_PASSWORD:?required}@postgres:5432/${SLEEPAGENT_TEST_POSTGRES_DB:?required}
      SLEEPAGENT_BACKEND_DATABASE_ROLE: ${SLEEPAGENT_TEST_POSTGRES_DEMO_USER:?required}
      SLEEPAGENT_BACKEND_SERVICE_PRINCIPAL_ID: sleepagent-demo-test
      SLEEPAGENT_BACKEND_SERVICE_CREDENTIAL_REF: test:key-provider/demo-service-credential
      SLEEPAGENT_BACKEND_POOL_MIN_SIZE: ${SLEEPAGENT_DEMO_POOL_MIN_SIZE:-1}
      SLEEPAGENT_BACKEND_POOL_MAX_SIZE: ${SLEEPAGENT_DEMO_POOL_MAX_SIZE:-2}
      SLEEPAGENT_BACKEND_DEMO_CONTROLLER_TOKEN: ${SLEEPAGENT_BACKEND_DEMO_CONTROLLER_TOKEN:?required}
    ports:
      - "18001:18001"
    depends_on:
      test-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:18001/livez', timeout=3).read()
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  internal-api:
    <<: *backend-image
    command:
      - uvicorn
      - sleepagent.app:app
      - --host
      - 0.0.0.0
      - --port
      - "18002"
    environment:
      <<: *runtime-environment
      SLEEPAGENT_BACKEND_PROFILE: test-postgres-internal
      SLEEPAGENT_BACKEND_PROCESS_ROLE: api
      SLEEPAGENT_BACKEND_ENABLED_SURFACES: internal
      SLEEPAGENT_BACKEND_DATABASE_DSN: postgresql://${SLEEPAGENT_TEST_POSTGRES_API_USER:?required}:${SLEEPAGENT_TEST_POSTGRES_API_PASSWORD:?required}@postgres:5432/${SLEEPAGENT_TEST_POSTGRES_DB:?required}
      SLEEPAGENT_BACKEND_DATABASE_ROLE: ${SLEEPAGENT_TEST_POSTGRES_API_USER:?required}
      SLEEPAGENT_BACKEND_SERVICE_PRINCIPAL_ID: sleepagent-bff-test
      SLEEPAGENT_BACKEND_SERVICE_CREDENTIAL_REF: test:key-provider/internal-service-credential
      SLEEPAGENT_BACKEND_INTERNAL_AUTH_TOKEN: ${SLEEPAGENT_BACKEND_INTERNAL_AUTH_TOKEN:?required}
      SLEEPAGENT_BACKEND_POOL_MIN_SIZE: ${SLEEPAGENT_INTERNAL_POOL_MIN_SIZE:-1}
      SLEEPAGENT_BACKEND_POOL_MAX_SIZE: ${SLEEPAGENT_INTERNAL_POOL_MAX_SIZE:-2}
    ports:
      - "18002:18002"
    depends_on:
      test-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:18002/livez', timeout=3).read()
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  worker:
    <<: *backend-image
    command:
      - python
      - -m
      - sleepagent.workers.runtime
      - run
      - --lease-seconds
      - ${SLEEPAGENT_TEST_WORKER_LEASE_SECONDS:-300}
      - --heartbeat-seconds
      - ${SLEEPAGENT_TEST_WORKER_HEARTBEAT_SECONDS:-10}
    environment:
      <<: *runtime-environment
      SLEEPAGENT_BACKEND_PROCESS_ROLE: worker
      SLEEPAGENT_BACKEND_ENABLED_SURFACES: ""
      SLEEPAGENT_BACKEND_DATABASE_DSN: postgresql://${SLEEPAGENT_TEST_POSTGRES_WORKER_USER:?required}:${SLEEPAGENT_TEST_POSTGRES_WORKER_PASSWORD:?required}@postgres:5432/${SLEEPAGENT_TEST_POSTGRES_DB:?required}
      SLEEPAGENT_BACKEND_DATABASE_ROLE: ${SLEEPAGENT_TEST_POSTGRES_WORKER_USER:?required}
      SLEEPAGENT_BACKEND_SERVICE_PRINCIPAL_ID: sleepagent-worker-test
      SLEEPAGENT_BACKEND_SERVICE_CREDENTIAL_REF: test:key-provider/worker-service-credential
      SLEEPAGENT_BACKEND_POOL_MIN_SIZE: ${SLEEPAGENT_WORKER_POOL_MIN_SIZE:-1}
      SLEEPAGENT_BACKEND_POOL_MAX_SIZE: ${SLEEPAGENT_WORKER_POOL_MAX_SIZE:-4}
      SLEEPAGENT_BACKEND_WORKER_QUEUES: ${SLEEPAGENT_TEST_WORKER_QUEUES:?required}
      # Replay data authority stays fake; Product LLM selection is independent.
      SLEEPAGENT_BACKEND_PROVIDER_MODE: fake
      SLEEPAGENT_BACKEND_MODEL_MODE: ${SLEEPAGENT_BACKEND_MODEL_MODE:-deterministic}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-${SLEEPAGENT_RADAR_AGENT_LLM_API_KEY:-}}
      SLEEPAGENT_RADAR_AGENT_LLM_API_KEY: ${SLEEPAGENT_RADAR_AGENT_LLM_API_KEY:-}
      SLEEPAGENT_RADAR_AGENT_LLM_MODEL_ID: ${SLEEPAGENT_RADAR_AGENT_LLM_MODEL_ID:-}
      SLEEPAGENT_RADAR_AGENT_LLM_BASE_URL: ${SLEEPAGENT_RADAR_AGENT_LLM_BASE_URL:-}
      SLEEPAGENT_RADAR_AGENT_LLM_TIMEOUT_SECONDS: ${SLEEPAGENT_RADAR_AGENT_LLM_TIMEOUT_SECONDS:-}
      SLEEPAGENT_PRODUCT_LLM_MODEL: ${SLEEPAGENT_PRODUCT_LLM_MODEL:-${SLEEPAGENT_RADAR_AGENT_LLM_MODEL_ID:-deepseek-v4-flash}}
      SLEEPAGENT_PRODUCT_LLM_BASE_URL: ${SLEEPAGENT_PRODUCT_LLM_BASE_URL:-${SLEEPAGENT_RADAR_AGENT_LLM_BASE_URL:-https://api.deepseek.com}}
      SLEEPAGENT_PRODUCT_LLM_TIMEOUT_SECONDS: ${SLEEPAGENT_PRODUCT_LLM_TIMEOUT_SECONDS:-${SLEEPAGENT_RADAR_AGENT_LLM_TIMEOUT_SECONDS:-30}}
      SLEEPAGENT_PRODUCT_LLM_MAX_TOKENS: ${SLEEPAGENT_PRODUCT_LLM_MAX_TOKENS:-4000}
    depends_on:
      test-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - sleepagent.workers.runtime
        - healthcheck
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  sleepagent_backend_test_postgres:
