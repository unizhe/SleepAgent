name: sleepagent

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sleepagent
      POSTGRES_USER: sleepagent
      POSTGRES_PASSWORD: sleepagent
    ports:
      - "15432:5432"
    volumes:
      - sleepagent_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U sleepagent -d sleepagent"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command:
      - uvicorn
      - backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - "18000"
    environment:
      SLEEPAGENT_DEPLOYMENT_MODE: ${SLEEPAGENT_DEPLOYMENT_MODE:-development}
      SLEEPAGENT_RADAR_AGENT_DATABASE_URL: postgresql://sleepagent:sleepagent@postgres:5432/sleepagent
      SLEEPAGENT_REPOSITORY_BACKEND: postgres
      SLEEPAGENT_SLEEP_DATA_AUTHORITY: ${SLEEPAGENT_SLEEP_DATA_AUTHORITY:-legacy_compatibility}
      SLEEPAGENT_PRODUCT_RADAR_PROVIDER_MODE: ${SLEEPAGENT_PRODUCT_RADAR_PROVIDER_MODE:-fake}
      SLEEPAGENT_PRODUCT_RADAR_NAMESPACE: ${SLEEPAGENT_PRODUCT_RADAR_NAMESPACE:-replay:compose-demo}
      SLEEP_DOMAIN_RAW_ENCRYPTION_KEY: ${SLEEP_DOMAIN_RAW_ENCRYPTION_KEY:-}
      SLEEP_DOMAIN_RAW_ENCRYPTION_KEY_ID: ${SLEEP_DOMAIN_RAW_ENCRYPTION_KEY_ID:-}
      SLEEP_DOMAIN_RAW_RETENTION_SECONDS: ${SLEEP_DOMAIN_RAW_RETENTION_SECONDS:-}
      SLEEPAGENT_PRODUCT_RADAR_API_KEY: ${SLEEPAGENT_PRODUCT_RADAR_API_KEY:-}
      SLEEPAGENT_PRODUCT_ACTOR_ID: ${SLEEPAGENT_PRODUCT_ACTOR_ID:-}
      SLEEPAGENT_PRODUCT_ACTOR_ROLE: ${SLEEPAGENT_PRODUCT_ACTOR_ROLE:-}
      SLEEPAGENT_PRODUCT_SUBJECT_ID: ${SLEEPAGENT_PRODUCT_SUBJECT_ID:-}
      SLEEPAGENT_PRODUCT_TIMEZONE: ${SLEEPAGENT_PRODUCT_TIMEZONE:-Asia/Shanghai}
      SLEEPAGENT_RADAR_AGENT_API_KEY: ${SLEEPAGENT_RADAR_AGENT_API_KEY:-}
      SLEEPAGENT_RADAR_AGENT_ACTOR_ID: ${SLEEPAGENT_RADAR_AGENT_ACTOR_ID:-}
      SLEEPAGENT_RADAR_AGENT_ACTOR_ROLE: ${SLEEPAGENT_RADAR_AGENT_ACTOR_ROLE:-}
      SLEEPAGENT_RADAR_AGENT_SUBJECT_ID: ${SLEEPAGENT_RADAR_AGENT_SUBJECT_ID:-}
      SLEEPAGENT_RADAR_AGENT_AUTHORIZATION_ID: ${SLEEPAGENT_RADAR_AGENT_AUTHORIZATION_ID:-}
      SLEEPAGENT_RADAR_AGENT_ROLE_BINDING_IDS: ${SLEEPAGENT_RADAR_AGENT_ROLE_BINDING_IDS:-}
      SLEEPAGENT_RADAR_AGENT_RUNTIME_MODE: ${SLEEPAGENT_RADAR_AGENT_RUNTIME_MODE:-product}
      SLEEPAGENT_RADAR_AGENT_DEV_MODE: ${SLEEPAGENT_RADAR_AGENT_DEV_MODE:-true}
    ports:
      - "18000:18000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18000/health', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_SLEEPAGENT_API_BASE_URL: http://127.0.0.1:18000
        NEXT_PUBLIC_SLEEPAGENT_MOCK_MODE: "false"
    environment:
      SLEEPAGENT_API_BASE_URL: http://backend:18000
      SLEEPAGENT_PRODUCT_RADAR_API_KEY: ${SLEEPAGENT_PRODUCT_RADAR_API_KEY:-}
      SLEEPAGENT_RADAR_AGENT_API_KEY: ${SLEEPAGENT_RADAR_AGENT_API_KEY:-}
      SLEEPAGENT_RADAR_AGENT_ACTOR_ID: ${SLEEPAGENT_RADAR_AGENT_ACTOR_ID:-demo-family-user}
      SLEEPAGENT_RADAR_AGENT_ACTOR_ROLE: ${SLEEPAGENT_RADAR_AGENT_ACTOR_ROLE:-family}
      SLEEPAGENT_HABIT_PROFILE_ACTOR_ID: ${SLEEPAGENT_HABIT_PROFILE_ACTOR_ID:-}
      SLEEPAGENT_HABIT_PROFILE_ACTOR_ROLE: ${SLEEPAGENT_HABIT_PROFILE_ACTOR_ROLE:-}
      SLEEPAGENT_HABIT_PROFILE_SUBJECT_ID: ${SLEEPAGENT_HABIT_PROFILE_SUBJECT_ID:-}
      SLEEPAGENT_HABIT_PROFILE_AUTHORIZATION_SCOPES: ${SLEEPAGENT_HABIT_PROFILE_AUTHORIZATION_SCOPES:-}
      NEXT_PUBLIC_SLEEPAGENT_API_BASE_URL: http://127.0.0.1:18000
      NEXT_PUBLIC_SLEEPAGENT_MOCK_MODE: "false"
    ports:
      - "18510:18510"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sleepagent_postgres:
