/var/lib/sleepagent/logs/b-stabilization/*.log /var/lib/sleepagent/logs/b-stabilization/*.jsonl {
    daily
    size 10M
    # Size rotation can occur more than once per day. Thirty-two slots keep at
    # least seven days at the measured rate while imposing a hard per-stream
    # bound of about 330 MiB including the active file.
    rotate 32
    maxage 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su sleepagent sleepagent
    create 0600 sleepagent sleepagent
}
